    <title>Niyam</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('niyam-theme') || localStorage.getItem('niyam-app-theme') || localStorage.getItem('productivity-app-theme');
          var theme = (stored === 'dark' || stored === 'light') ? stored : 'system';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(theme);
          var data = localStorage.getItem('niyamAppData') || localStorage.getItem('productivityAppData');
          if (data) {
            var parsed = JSON.parse(data);
            var fs = parsed && parsed.settings && parsed.settings.fontSize;
            if (fs === 'small' || fs === 'large') {
              document.documentElement.classList.add('font-size-' + fs);
            } else {
              document.documentElement.classList.add('font-size-medium');
            }
          } else {
            document.documentElement.classList.add('font-size-medium');
          }
        } catch (e) {
          document.documentElement.classList.add('light', 'font-size-medium');
        }
      })();
    </script>
